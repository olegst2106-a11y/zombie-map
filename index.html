<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Планшет рассказчика</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#1c2428;--panel:#243036;--ink:#e8e3d4;--dim:#9aa6a3;--line:#3a4a50;--red:#c2402f;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif}
#bar{display:flex;gap:8px;padding:8px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--panel)}
input,textarea,button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px}
#q{flex:1;min-width:0}
button.main{background:var(--red);border-color:var(--red);font-weight:600}
#map{flex:1 1 45%;min-height:220px}
#panel{flex:1 1 40%;overflow:auto;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:2px solid var(--red)}
#out{white-space:pre-wrap;user-select:text;font:14px/1.45 ui-monospace,Menlo,monospace;margin:0 0 10px}
#note{width:100%;min-height:56px;margin-bottom:8px;resize:vertical}
.mkc{width:26px;height:26px;border-radius:50%;border:2px solid #fff;color:#fff;font:700 11px/22px system-ui,sans-serif;text-align:center;box-shadow:0 0 3px #000}
#cp{position:sticky;bottom:0;background:var(--panel);padding-top:4px;display:flex;gap:6px}#cp button{padding:10px}
.hint{color:var(--dim)}
select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px}
#tabs{display:flex;gap:6px;margin-bottom:8px}
#tabs button.on{background:var(--red);border-color:var(--red)}
.hero{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:10px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.g input,.g select{width:100%;min-width:0;padding:8px}
.hero textarea,.act{width:100%;min-height:60px;margin-bottom:6px}
label{display:block;color:var(--dim);font-size:12px}
.w{font-size:14px;margin:0 0 4px}
.bad{color:#ff8a70}
#clock{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
#clock button{padding:8px}
#rl{font:14px ui-monospace,Menlo,monospace;white-space:pre-wrap;margin:0 0 8px}
#mode{display:flex;gap:6px;padding:6px 8px;background:var(--panel)}
#mode button{flex:1;padding:8px}
#mode button.on{background:var(--red);border-color:var(--red)}
#mode{flex-wrap:wrap}#mode select{padding:8px}
.mk{font-size:20px;line-height:28px;text-align:center;text-shadow:0 0 3px #000}
.bar{height:6px;background:var(--bg);border-radius:3px;margin-top:3px}.bar i{display:block;height:100%;border-radius:3px}
.dl{display:flex;gap:10px;margin-bottom:6px}.dl>div{flex:1;display:grid;gap:4px;align-content:start}.hero button{padding:8px}
details{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;padding:6px 8px}summary{cursor:pointer;font-weight:700;padding:4px 0}.chip.on{background:var(--red);border-color:var(--red)}#hs>.g button.on{border-color:#fff;font-weight:700}
</style>
</head>
<body>
<div id="bar">
  <input id="q" placeholder="Найти место: город, улица, адрес" enterkeyhint="search">
  <button id="go">Найти</button>
</div>
<div id="mode"><button id="m2" class="on">Оба вместе</button><button id="m0">Игрок 1</button><button id="m1">Игрок 2</button><button id="mkb">Метка</button><select id="mt"></select><button id="mh">Карта ▲</button></div>
<div id="map"></div>
<div id="panel">
  <div id="tabs"><button id="t0" class="on">Сводка</button><button id="t1">Герои</button><button id="t2">Мир</button><button id="t3">Журнал</button></div>
  <section id="p0">
    <pre id="out" class="hint">Нажми на карту, чтобы поставить героев. Сводка появится здесь.</pre>
    <div class="g"><select id="df"><option value="80">Лёгкое</option><option value="55" selected>Обычное</option><option value="30">Трудное</option><option value="10">Почти невозможное</option></select><input id="md" type="number" value="0" step="5" aria-label="Сдвиг шанса, пункты"></div>
    <button id="dice" style="width:100%;margin-bottom:8px">Бросок d100</button>
    <pre id="rl" class="hint">Бросок копируется в буфер, когда рассказчик просит.</pre>
  </section>
  <section id="p1" hidden>
    <div id="clock"><b id="clk"></b><button data-m="10">+10 мин</button><button data-m="60">+1 ч</button><button data-m="360">+6 ч</button><input id="ta" type="number" placeholder="Воздух °C" style="width:90px"><select id="wx"><option value="0">сухо</option><option value="1">ветер</option><option value="2">дождь</option></select><input id="tp" placeholder="Заметка о погоде" style="width:120px"><select id="act"></select></div>
    <div id="hs"></div>
  </section>
  <section id="p2" hidden><div id="wd"></div></section>
  <section id="p3" hidden><div id="lgw"></div></section>
  <div id="cp"><button id="copy" class="main" style="flex:3">Копировать для рассказчика</button><button id="copy2" style="flex:1">Полная</button></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const R=300, DIRS=['С','СВ','В','ЮВ','Ю','ЮЗ','З','СЗ'];
const EP=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
const SH={supermarket:'супермаркет',convenience:'магазин у дома',mall:'ТЦ',hardware:'хозтовары',doityourself:'стройматериалы',alcohol:'алкоголь',clothes:'одежда',car_repair:'автосервис',kiosk:'киоск'};
const $=id=>document.getElementById(id);
let mode=2;const pos=[null,null],rep=['',''],mk=[null,null],rg=[null,null],COL=['#c2402f','#3b82c4'];

const map=L.map('map').setView([53.11,50.22],11);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
map.on('click',e=>onMap(e.latlng.lat,e.latlng.lng));

function dist(a,b,c,d){const r=Math.PI/180,x=(c-a)*r,y=(d-b)*r*Math.cos((a+c)/2*r);return Math.hypot(x,y)*6371000}
function dir(a,b,c,d){const r=Math.PI/180,t=Math.atan2((d-b)*r*Math.cos(a*r),(c-a)*r)*180/Math.PI;return DIRS[Math.round(((t+360)%360)/45)%8]}

function cls(t){
  const a=t.amenity;
  if(a==='pharmacy')return 'Аптеки';
  if(/^(hospital|clinic|doctors)$/.test(a))return 'Медицина';
  if(/^(police|fire_station)$/.test(a))return 'Полиция и пожарные';
  if(a==='fuel')return 'Заправки';
  if(/^(school|kindergarten)$/.test(a))return 'Школы и сады';
  if(/^(restaurant|cafe|fast_food)$/.test(a))return 'Еда';
  if(t.shop)return 'Магазины';
  if(t.man_made)return 'Вода и ёмкости';
  if(t.building==='warehouse'||t.industrial)return 'Склады и промзона';
  if(parseInt(t['building:levels'])>=9)return 'Высотки 9+ эт.';
  return null;
}
function label(t){
  if(t.name)return t.name+(t.shop?' ('+(SH[t.shop]||t.shop)+')':'');
  if(t.shop)return SH[t.shop]||t.shop;
  if(t['building:levels'])return 'дом, '+t['building:levels']+' эт.';
  return 'без названия';
}

async function geo(lat,lng){
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&zoom=18&accept-language=ru&lat=${lat}&lon=${lng}`);
    return (await r.json()).display_name||'';
  }catch(e){return ''}
}
async function over(lat,lng){
  const a=`(around:${R},${lat},${lng})`;
  const q=`[out:json][timeout:25];(nwr${a}["amenity"~"^(pharmacy|hospital|clinic|doctors|police|fire_station|fuel|school|kindergarten|restaurant|cafe|fast_food)$"];nwr${a}["shop"];nwr${a}["man_made"~"^(water_tower|storage_tank)$"];nwr${a}["building"="warehouse"];nwr${a}["industrial"];nwr${a}["building:levels"~"^(9|[12][0-9])$"];way${a}["highway"~"^(motorway|trunk|primary|secondary|tertiary|residential|unclassified|living_street)$"];);out center tags;`;
  for(const u of EP){
    try{
      const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(q)});
      if(r.ok)return (await r.json()).elements;
    }catch(e){}
  }
  throw new Error('overpass');
}

function build(lat,lng,addr,els){
  const g={},roads={},br=new Set();
  for(const e of els){
    const t=e.tags||{};
    if(t.highway){const n=t.name||t.ref;if(n){roads[n]=1;if(t.bridge)br.add(n)}continue}
    const k=cls(t);if(!k)continue;
    const la=e.lat??(e.center&&e.center.lat),lo=e.lon??(e.center&&e.center.lon);
    if(la==null)continue;
    (g[k]=g[k]||[]).push({n:label(t),la,lo});
  }
  return {addr,g,roads:Object.keys(roads),br:[...br]};
}
function snapd(m,i){const r=rep[i];return m.t!=='затор'&&r&&typeof r==='object'&&Object.values(r.g).some(v=>v.some(o=>dist(o.la,o.lo,m.la,m.lo)<=SNAP))}
function fmt(sc,i){
  if(typeof sc==='string')return sc;
  const q=pos[i],ln=[`Точка: ${q[0].toFixed(5)}, ${q[1].toFixed(5)}`];
  if(sc.addr)ln.push('Адрес: '+sc.addr);
  for(const [k,v] of Object.entries(sc.g)){
    const it=v.map(o=>{const ms=S.marks.filter(m=>m.t!=='затор'&&dist(o.la,o.lo,m.la,m.lo)<=SNAP);
      return {...o,d:dist(q[0],q[1],o.la,o.lo),w:dir(q[0],q[1],o.la,o.lo),s:ms.some(m=>m.t==='обыскано'),tg:[...new Set(ms.map(m=>(EFF[m.t]||'')+(m.n?(EFF[m.t]?': ':'')+m.n:'')).filter(Boolean))]}}).sort((a,b)=>a.s-b.s||a.d-b.d);
    const ns=it.filter(x=>x.s).length;
    ln.push('',`${k} (${it.length}${ns?', обыскано '+ns:''}):`);
    it.slice(0,5).forEach(x=>ln.push(`- ${x.n}: ${x.w}, ${Math.round(x.d)} м${x.d<=100?' (рядом)':''}${x.tg.length?' ['+x.tg.join('; ')+']':''}`));
  }
  if(sc.roads.length)ln.push('','Дороги: '+sc.roads.slice(0,8).join(', '));
  if(sc.br.length)ln.push('Мосты: '+sc.br.join(', '));
  if(!Object.keys(sc.g).length&&!sc.roads.length)ln.push('','Поблизости ничего не отмечено: пустырь, поле или лес.');
  return ln.join('\n');
}

function show(t,dim){const o=$('out');o.textContent=t;o.className=dim?'hint':''}

function area(){
  if(!pos[0]&&!pos[1])return 'не выбрана';
  const d=pos[0]&&pos[1]?dist(pos[0][0],pos[0][1],pos[1][0],pos[1][1]):null,tog=d!==null&&d<=100;
  const nm=i=>{const q=pos[i];if(!q)return [];const k=S.marks.filter(m=>!snapd(m,i)).map(m=>({m,d:dist(q[0],q[1],m.la,m.lo),w:dir(q[0],q[1],m.la,m.lo)})).filter(x=>x.d<=R).sort((a,b)=>a.d-b.d).map(x=>`${x.m.t}: ${x.w}, ${Math.round(x.d)} м${x.m.n?' ('+x.m.n+')':''}`);return k.length?['','Метки:',...k]:[]};
  const sec=(h,i)=>[h,rep[i]?fmt(rep[i],i):'(нет данных сканера)',...nm(i)].join('\n');
  const o=[`Обзор ${R} м, «рядом» = до 100 м.`];
  if(tog)o.push(sec('ОБА ГЕРОЯ ВМЕСТЕ',0));
  else{[0,1].forEach(i=>o.push(pos[i]?sec(`ИГРОК ${i+1} (${S.h[i].n||'без имени'})`,i):`ИГРОК ${i+1}: ещё не на карте`));if(d!==null)o.push(`Между героями: ${Math.round(d)} м, игрок 2 на ${dir(...pos[0],...pos[1])} от игрока 1.`)}
  return o.join('\n\n');
}
async function scan(lat,lng){
  const t=mode===2?[0,1]:[mode],p=[lat,lng];
  t.forEach(i=>{
    pos[i]=p;rep[i]='';
    if(mk[i]){mk[i].setLatLng(p);rg[i].setLatLng(p)}
    else{
      mk[i]=L.circleMarker(p,{radius:9,color:'#fff',weight:2,fillColor:COL[i],fillOpacity:1}).addTo(map);
      rg[i]=L.circle(p,{radius:R,color:COL[i],weight:1,dashArray:'4 4',fill:false}).addTo(map);
    }
  });
  show('Сканирую местность…',true);save();
  try{
    const [addr,els]=await Promise.all([geo(lat,lng),over(lat,lng)]);
    const r=build(lat,lng,addr,els);t.forEach(i=>rep[i]=r);lg('сканирование: '+(r.addr||'').split(',').slice(0,2).join(','));show(area());save();
  }catch(e){
    show('Сервер карт не ответил. Нажми на карту ещё раз через несколько секунд.',true);
  }
}
[2,0,1].forEach(m=>$('m'+m).onclick=()=>{mode=m;[2,0,1].forEach(k=>$('m'+k).classList.toggle('on',k===m))});

async function find(){
  const q=$('q').value.trim();if(!q)return;
  try{
    const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=ru&q='+encodeURIComponent(q));
    const j=await r.json();
    if(!j.length){show('Место не найдено. Попробуй написать иначе.',true);return}
    const la=+j[0].lat,lo=+j[0].lon;
    map.setView([la,lo],16);scan(la,lo);
  }catch(e){show('Поиск не ответил. Попробуй ещё раз.',true)}
}
$('go').onclick=find;
$('q').onkeydown=e=>{if(e.key==='Enter')find()};

const LK='zmb2',RATE={h:.45,t:.6,f:.6},SUN=[0,1,4];let mkMode=false;
const ACT=[['покой',1.2,.4],['ходьба налегке',3.5,.6],['ходьба с грузом',4.5,.9],['бег',8,2],['сон',.95,-1.5],['тяжёлая работа',6,1.2]];
const FOODS=[['Хлеб',250,8,3,49,[0,15,0,0,3,10,3,15]],['Тушёнка',230,15,18,0,[0,10,0,2,2,15,2,20]],['Гречка сухая',340,13,3,72,[0,25,0,0,5,25,2,0]],['Макароны сухие',350,12,1.5,72,[0,10,0,0,2,10,1,0]],['Рис сухой',350,7,1,78,[0,8,0,0,1,5,1,0]],['Фасоль консерв.',100,7,.5,17,[0,10,5,0,3,15,5,10]],['Картофель',77,2,.1,17,[0,10,20,0,1,5,1,5]],['Яблоко',52,.3,.2,14,[1,3,10,0,2,1,1,0]],['Апельсин',47,1,.1,12,[5,5,90,0,2,1,4,0]],['Овощи консерв.',25,1,.1,5,[20,5,15,0,3,5,3,25]],['Рыбные консервы',200,20,13,0,[5,15,0,60,5,10,20,25]],['Сыр',350,25,28,1,[20,5,0,5,3,2,70,40]],['Печенье',450,7,15,70,[0,5,0,0,3,5,2,10]],['Шоколад',540,6,31,58,[0,5,0,0,5,20,5,3]],['Орехи',600,18,55,10,[0,10,0,0,50,15,10,0]],['Сгущёнка',320,7,8,55,[5,10,0,3,1,1,25,5]]];
const MT={'обыскано':'ОБ','затор':'ЗТ','зомби':'ЗМ','орда':'ОР','убежище':'УБ','опасность':'ОП','вода':'ВД','топливо':'ТП','транспорт':'ТР','люди':'ЛД','добыча':'ДБ','закрыто':'ЗК','заметка':'ЗА'};
const MC={'обыскано':'#6b7b80','затор':'#c2402f','зомби':'#c2402f','орда':'#8f1d1d','убежище':'#3f9a5a','опасность':'#d88a2a','вода':'#3a8fd6','топливо':'#c9a227','транспорт':'#c9a227','люди':'#8a5ad0','добыча':'#c9a227','закрыто':'#7a5a3a','заметка':'#4a6a8a'};
const SNAP=45,EFF={'обыскано':'обыскан','добыча':'есть добыча','закрыто':'заперто','зомби':'зомби рядом','орда':'орда рядом','убежище':'убежище','опасность':'опасно','вода':'есть вода','топливо':'есть топливо','транспорт':'есть транспорт','люди':'люди','заметка':''};
const LIC=['M','A','B','C','D','E','тракторист'],VM=[['A','вит. A'],['B','вит. B'],['C','вит. C'],['D','вит. D'],['E','вит. E'],['Fe','железо'],['Ca','кальций'],['El','электролиты']],VR=[.6,2,3.3,.8,.5,.5,.25,12];
const VT={'Велосипед':[0,0,15,25,1,'—',0],'Самокат':[0,0,12,5,1,'—',0],'Ролики':[0,0,12,0,1,'—',0],'Скутер':[3,6,35,20,2,'M',1],'Мотоцикл':[5,15,40,40,2,'A',1],'Квадроцикл':[7,15,30,50,2,'A/тракторист',1],'Легковая':[8,50,30,400,5,'B',0],'Внедорожник':[12,70,30,500,5,'B',0],'Пикап':[11,70,30,900,5,'B',0],'Микроавтобус':[11,70,28,1000,8,'B/D',1],'Лёгкий фургон':[12,80,28,1000,3,'B',1],'Грузовик':[25,100,25,5000,3,'C',1],'Тягач с прицепом':[35,300,22,20000,2,'C/E',1],'Автобус':[30,200,22,2000,40,'D',1],'Трактор':[15,200,12,1000,2,'тракторист',1]};
const ZN=['голова','грудь','живот','л.рука','п.рука','л.нога','п.нога'],ZS=['','ушиб/ссадина','тяжёлая рана','перелом'],ZC=['#44545a','#d8b34a','#c2402f','#9a6ad0'];
const EQ=['голова','торс','ноги','обувь','спина','руки'],ND=[['h','Голод','#d8a34a'],['t','Жажда','#4aa3d8'],['f','Усталость','#9a8ad0'],['s','Стресс','#d85a4a'],['pn','Боль','#e0604a'],['bl','Кровопотеря','#b03030'],['if','Инфекция','#7ab030'],['po','Отравление','#a0b030']];
const CLO=[[/пухов|зимн\S* куртк|шуб/i,18],[/куртк|пальто|плащ|парк/i,8],[/ветровк/i,5],[/свитер|толстовк|худи|флис|кофт/i,7],[/рубашк|футболк|майк/i,3],[/термобел/i,8],[/утеплённ|утеплен|зимн\S* (брюк|штан)/i,8],[/джинс|брюк|штан|спорт/i,5],[/шорт/i,1],[/зимн\S* (ботинк|сапог|обув)|унт|валенк/i,6],[/ботинк|сапог/i,4],[/кроссов|кед|туфл|сандал/i,3],[/шапк|кепк|капюшон|балаклав/i,3],[/перчат|варежк/i,3],[/шарф|бафф/i,2],[/носк/i,1],[/рюкзак|сумк/i,0]];
const WXA=[0,-5,-8],DR=[['Вода чистая',0,0],['Вода кипячёная',0,0],['Вода сырая',0,1.2],['Пиво 5%',5,0],['Вино 12%',12,0],['Водка 40%',40,0],['Самогон 45%',45,0]];
function warm(x){let t=0;x.eq.forEach(sl=>String(sl).split(/[,+;]| и /).forEach(it=>{it=it.trim();if(!it)return;const m=CLO.filter(c=>c[0].test(it)).map(c=>c[1]);t+=m.length?Math.max(...m):3}));return Math.min(t,45)}
const feel=x=>(+S.ta||0)+warm(x)*.55+(ACT[S.act][1]-1.2)*1.5+WXA[S.wx];
function thl(f){const t=Math.max(0,Math.min(10,5+(f-21)/4));return t<=1?'опасный холод':t<=2.5?'мёрзнет':t<=3.8?'холодно':t<=4.6?'прохладно':t<=5.6?'комфортно':t<=6.6?'тепло':t<=7.8?'жарко':t<=9?'очень жарко':'перегрев'}
const alb=a=>a<.3?'трезв':a<1?'лёгкое':a<2?'пьян':a<3?'сильно пьян':'опасно';

function adv(m){
  const a=ACT[S.act],c=v=>Math.max(0,Math.min(10,v));let nd=false;
  S.min+=m;while(S.min>=1440){S.min-=1440;S.day++;nd=true}
  S.h.forEach(x=>{
    const f=feel(x),bn=a[1]*(+x.kg||70)*m/60*(f<10?1+(10-f)*.02:1),dg=Math.min(x.sk,150*m/60),fr=x.sk?dg/x.sk:0;
    x.bk+=bn;x.dk+=dg;x.dp+=x.sp*fr;x.df+=x.sf*fr;x.dc+=x.sc*fr;
    x.sp-=x.sp*fr;x.sf-=x.sf*fr;x.sc-=x.sc*fr;x.sk-=dg;
    x.kg=Math.max(30,(+x.kg||70)+(dg-bn)/7700);
    x.h=c(x.h+RATE.h*m/60*(x.sk>100?.3:1)*(S.act==4?.5:1));
    x.t=c(x.t+RATE.t*m/60*(a[1]>3?1.5:1)*(f>28?1+(f-28)*.06:1));
    x.f=c(x.f+a[2]*m/60);
    x.mn=x.mn.map((v,k)=>Math.max(0,v-VR[k]*m/1440));
    if(x.z.some(v=>v>0)&&x.hg>=6)x.if=c(x.if+.1*m/60);
    x.hg=c(x.hg+.15*m/60*(.5+a[1]/3)*(S.wx==2?1.5:1));x.wc=c(x.wc+.3*m/60);
    if(S.act==4)x.sl=(x.sl||0)+m/60;x.al=Math.max(0,x.al-.15*m/60);x.po=c(x.po-.2*m/60);
    const tg=f<8?36.6-(8-f)*.12:f>32?36.6+(f-32)*.1:36.6;
    x.tb=Math.max(30,Math.min(42,(+x.tb||36.6)+(tg-x.tb)*(1-Math.exp(-m/180))));
    if(nd){x.dk=x.dp=x.df=x.dc=x.bk=0;x.sl=0}
  });
  S.dev.forEach(d=>{if(d.on)d.c=Math.max(0,d.c-d.r*m/60)});
  S.ph=Math.max(0,Math.min(100,S.ph-.5*m/60+(['рассвет','день'].includes(lt())?SUN[S.sun]*m/60:0)));
  render();renderWorld();save();
}

  else if(a==='dt')S.dev[i].on=!S.dev[i].on;else if(a==='dd')S.dev.splice(i,1);
  else if(a==='aw')S.wp.push({n:'',mg:8,m:0,r:0});else if(a==='ww')S.wp.splice(i,1);
  else if(a==='ws'){const w=S.wp[i],n=parseInt(prompt('Сколько выстрелов? В магазине '+w.m,'1'))||0;if(n<=0)return;if(n>w.m){alert('В магазине только '+w.m);return}w.m-=n;lg((w.n||'оружие')+': выстрелов '+n+', в магазине '+w.m)}
  else if(a==='wr'){const w=S.wp[i],k=Math.min(w.mg-w.m,w.r);w.m+=k;w.r-=k;lg((w.n||'оружие')+': перезарядка, в магазине '+w.m+', запас '+w.r)}
  else if(a==='ac')S.comp.push({n:'',k:'',s:''});else if(a==='dc')S.comp.splice(i,1);
  else if(a==='av')S.veh.push({t:'Велосипед',n:'',f:0});else if(a==='dv')S.veh.splice(i,1);
  else if(a==='fl')S.veh[i].f=VT[S.veh[i].t][1];
  else if(a==='dr'){drive(i);return}
  else if(a==='im')impMarks($('imp').value);
  save();renderWorld();
});
function vinfo(v){const r=VT[v.t],need=r[5]==='—'?[]:r[5].split('/'),lic=i=>need.some(t=>(S.h[i].lic||'').split(' ').includes(t));
  return `кат. ${r[5]}, ${r[6]?'сложная':'простая'} техника, груз ${r[3]} кг, мест ${r[4]}, ${r[2]} км/ч`+(r[0]?`; запас хода ~${Math.round(v.f/r[0]*100)} км, в завалах вдвое меньше`:'')+(need.length?`; права: И1 ${lic(0)?'есть':'нет'}, И2 ${lic(1)?'есть':'нет'}`:'')}
function drive(i){
  const v=S.veh[i],r=VT[v.t],km=parseFloat((prompt('Сколько км? Запас хода ~'+(r[0]?Math.round(v.f/r[0]*100)+' км':'без ограничения'),'')||'').replace(',','.'));
  if(!(km>0))return;
  if(r[0]){
    const need=km*r[0]/100*(confirm('Завалы или город (расход ×2)? ОК = да')?2:1);
    if(need>v.f){alert('Топлива не хватит. Хватит примерно на '+Math.floor(v.f/(need/km))+' км.');return}
    v.f=+(v.f-need).toFixed(1);
  }
  lg('поездка '+km+' км: '+v.t+(r[0]?', топливо осталось '+v.f+' л':''));const a0=S.act;S.act=r[0]?0:1;adv(Math.round(km/r[2]*60));S.act=a0;$('act').value=a0;
}
function impMarks(txt){
  const c={m:0,w:0,s:0},NS={'голод':'h','жажда':'t','усталость':'f','стресс':'s','боль':'pn','кровопотеря':'bl','инфекция':'if','отравление':'po'};let tm=0;
  for(const l of txt.split('\n')){
    const a=l.split('|').map(x=>x.trim());if(a.length<2)continue;const k=a[0].toLowerCase();
    if(k==='время'){if(+a[1]>0)tm+=+a[1];continue}
    const i=(+a[1]||1)-1,x=S.h[i];
    if(k==='рана'&&x&&a.length>=4){const z=ZN.findIndex(n=>n.startsWith(a[2].toLowerCase())),lv=/перел/i.test(a[3])?3:/тяж|рана/i.test(a[3])?2:/ушиб|ссад/i.test(a[3])?1:0;if(z>=0){x.z[z]=lv;lg((x.n||'И'+(i+1))+': '+ZN[z]+' - '+(ZS[lv]||'норма')+' (рассказчик)');c.w++}continue}
    if(k==='шкала'&&x&&a.length>=4){const kk=NS[a[2].toLowerCase()],d=parseFloat(a[3].replace(',','.'));if(kk&&!isNaN(d)){x[kk]=Math.max(0,Math.min(10,(+x[kk]||0)+d));lg((x.n||'И'+(i+1))+': '+a[2]+' '+a[3]+' (рассказчик)');c.s++}continue}
    if(a.length<4)continue;
    const t=Object.keys(MT).find(q=>k.startsWith(q.slice(0,4))),w=DIRS.indexOf(a[2].toUpperCase()),m=parseFloat(a[3]),p=pos[i];
    if(!t||w<0||!(m>0)||!p)continue;
    const b=w*Math.PI/4;addMark(t,p[0]+m*Math.cos(b)/111320,p[1]+m*Math.sin(b)/(111320*Math.cos(p[0]*Math.PI/180)),a[4]||'');c.m++;
  }
  if(tm){lg('время +'+tm+' мин (рассказчик)');adv(tm)}else{render();save()}
  alert(`Применено: меток ${c.m}, время ${tm} мин, ран ${c.w}, шкал ${c.s}`);
}
function drawMark(o){
  const m=L.marker([o.la,o.lo],{icon:L.divIcon({className:'mk',html:`<div class="mkc" style="background:${MC[o.t]}">${MT[o.t]}</div>`,iconSize:[28,28]})}).addTo(map);
  m.on('click',()=>{if(confirm('Удалить метку: '+o.t+(o.n?' ('+o.n+')':'')+'?')){map.removeLayer(m);S.marks=S.marks.filter(x=>x!==o);save();out()}});
}
function addMark(t,la,lo,n){const o={t,la,lo,n};lg('метка: '+t+(n?' ('+n+')':''));S.marks.push(o);drawMark(o);save();out()}
function onMap(la,lo){
  if(mkMode){const n=prompt('Подпись метки (можно пусто)','');if(n===null)return;addMark($('mt').value,la,lo,n.trim())}
  else scan(la,lo);
}
function topNames(){$('m0').textContent=S.h[0].n||'Игрок 1';$('m1').textContent=S.h[1].n||'Игрок 2'}
function applyMap(){$('map').style.display=S.mh?'none':'';$('mh').textContent=S.mh?'Карта ▼':'Карта ▲';if(!S.mh)setTimeout(()=>map.invalidateSize(),50)}
$('mh').onclick=()=>{S.mh=!S.mh;applyMap();save()};applyMap();
$('mkb').onclick=()=>{mkMode=!mkMode;$('mkb').classList.toggle('on',mkMode);$('mkb').textContent=mkMode?'Метка: ВКЛ':'Метка'};
$('mt').innerHTML=Object.keys(MT).map(k=>`<option value="${k}">${MT[k]} ${k}</option>`).join('');

$('dice').onclick=()=>{
  const d=1+Math.floor(Math.random()*100),b=+$('df').value,m=+$('md').value||0,th=Math.max(0,Math.min(95,b+m));
  const res=d<=th?(d<=5?'УСПЕХ с бонусом':'успех'):(d>=96?'ПРОВАЛ с осложнением':'промах');
  S.roll=`d100 = ${d}, порог ${th}% (${$('df').selectedOptions[0].text.toLowerCase()}${m?', сдвиг '+(m>0?'+':'')+m:''}): ${res}`;
  $('rl').textContent=S.roll+' (скопировано)';$('rl').className='';try{navigator.clipboard.writeText(S.roll)}catch(e){}save();
};

function sym(x){const a=[];
  if(x.tb<35)a.push('озноб, дрожь, спутанность');else if(x.tb>38)a.push('жар, потливость');
  if(x.po>=4)a.push('тошнота, диарея');if(x.if>=4)a.push('воспаление ран, лихорадка');
  if(x.mn[2]<30)a.push('кровоточат дёсны, слабость (нехватка C)');if(x.mn[5]<30)a.push('бледность, одышка (нехватка железа)');if(x.mn[7]<20)a.push('судороги (нехватка электролитов)');
  if(x.bl>=5)a.push('слабость, головокружение');if(x.pn>=6)a.push('сильная боль');if(x.h>=8)a.push('слабость от голода');if(x.t>=8)a.push('сухость, головная боль');if(x.f>=8)a.push('клюёт носом');if(x.al>=1)a.push('нарушена координация');return a}
const lg=t=>{S.lg.push([S.day,S.min,t]);if(S.lg.length>300)S.lg.shift();if(document.getElementById('lp'))fillLog()};
const fl=e=>`Д${e[0]} ${pad(Math.floor(e[1]/60))}:${pad(e[1]%60)} ${e[2]}`;
function fillLog(){$('lp').textContent=S.lg.slice(-80).reverse().map(fl).join('\n')}
function renderLog(){
  $('lgw').innerHTML=`<div class="hero"><b>Журнал событий</b><div class="g"><input id="ln" placeholder="Заметка в журнал"><button id="la">Добавить</button></div><div class="g"><button id="lc">Копировать за сутки</button><button id="lx">Очистить</button></div><pre id="lp" style="white-space:pre-wrap;margin:6px 0 0;font:13px ui-monospace,Menlo,monospace"></pre></div>`;
  fillLog();
  $('la').onclick=()=>{const v=$('ln').value.trim();if(v){lg('заметка: '+v);$('ln').value=''}};
  $('lc').onclick=async()=>{const t=S.day*1440+S.min-1440,e=S.lg.filter(x=>x[0]*1440+x[1]>=t).map(fl);try{await navigator.clipboard.writeText('ЖУРНАЛ ЗА СУТКИ (для файла 04)\n'+e.join('\n'));$('lc').textContent='Скопировано'}catch(er){}setTimeout(()=>$('lc').textContent='Копировать за сутки',2000)};
  $('lx').onclick=()=>{if(confirm('Очистить журнал?')){S.lg=[];fillLog();save()}};
}
function makeSummary(full){
  const R=Math.round,r1=v=>Math.round((+v||0)*10)/10;
  const hv=(x,i)=>{
    const r=st(x),f=feel(x),z=ZN.map((a,k)=>x.z[k]?`${a}: ${ZS[x.z[k]]}`:'').filter(Boolean).join(', '),eq=EQ.map((l,k)=>x.eq[k]?`${l} ${x.eq[k]}`:'').filter(Boolean).join(', ');
    const sc=[['голод',x.h],['жажда',x.t],['усталость',x.f],['стресс',x.s],['боль',x.pn],['кровопотеря',x.bl],['инфекция',x.if],['отравление',x.po],['грязь',x.hg],['туалет',x.wc]].filter(([,v])=>full||v>=2).map(([l,v])=>l+' '+r1(v)).join(', ');
    const lo=VM.map((v,k)=>[v[0],x.mn[k]]).filter(([,v])=>full||v<60).map(([a,v])=>a+' '+R(v)).join(', '),sy=sym(x).join(', '),o=[];
    o.push(`ИГРОК ${i+1}: ${x.n||'без имени'}`,`вес ${(+x.kg).toFixed(1)} кг`,`активность: ${ACT[S.act][0]}`);
    if(z||x.hp||full)o.push('раны: '+([x.hp,z].filter(Boolean).join('; ')||'нет'));
    o.push('шкалы 0-10: '+(sc||'всё в норме'));
    o.push(`ощущается как ${R(f)} °C (${thl(f)}), тело ${(+x.tb).toFixed(1)} °C`);
    if(x.al>.05||full)o.push(`опьянение ${x.al.toFixed(2)}‰ (${alb(x.al)})`);
    o.push(`ноша ${r.w.toFixed(1)} из ${r.c.toFixed(1)} кг`+(r.s==='комфортно'?'':' ('+r.s+')'));
    if(eq||full)o.push('надето: '+(eq||'-'));
    o.push('вещи: '+(names(x)||'пусто'));
    o.push(`за день: ${R(x.dk)} ккал (Б ${R(x.dp)}, Ж ${R(x.df)}, У ${R(x.dc)}), потрачено ${R(x.bk)}, в желудке ${R(x.sk)} ккал`);
    o.push('запасы '+(lo?'низкие: '+lo:'в норме'));
    if(x.sl>0||full)o.push(`спал сегодня ${r1(x.sl)} ч`);
    if(sy)o.push('симптомы: '+sy);
    return o.join('; ')};
  const o=[`ВРЕМЯ: ${clk()}, воздух ${S.ta}°C${S.wx?', '+['','ветер','дождь'][S.wx]:''}${S.tp?', '+S.tp:''}`,...S.h.map(hv),`КПК: ${R(S.ph)}%`+(S.dev.length?'; '+S.dev.map(d=>`${d.n||'устройство'} ${R(d.c)}%${d.on?' (вкл)':''}`).join(', '):'')];
  if(S.wp.length)o.push('ОРУЖИЕ: '+S.wp.map(w=>`${w.n||'оружие'}, в магазине ${w.m} из ${w.mg}, запас ${w.r}`).join('; '));
  if(S.comp.length)o.push('СПУТНИКИ: '+S.comp.map(c=>`${c.n||'?'} (${c.k||'-'}): ${c.s||'-'}`).join('; '));
  if(S.veh.length)o.push('ТРАНСПОРТ: '+S.veh.map(v=>`${v.t} (кат. ${VT[v.t][5]})${v.n?' '+v.n:''}${VT[v.t][0]?', топливо '+v.f+' из '+VT[v.t][1]+' л':''}`).join('; '));
  const sig=JSON.stringify([pos,S.marks.map(m=>m.t+m.la.toFixed(4)+m.lo.toFixed(4))]);
  o.push('МЕСТНОСТЬ:\n'+(!full&&sig===S.lastSig?'без изменений с прошлой сводки (точка, объекты и метки те же)':area()));
  return {txt:o.join('\n\n'),sig};
}
async function doCopy(full){
  const {txt,sig}=makeSummary(full);
  try{await navigator.clipboard.writeText(txt);S.lastSig=sig;$('copy').textContent='Скопировано ('+txt.length+' симв.)'}catch(e){$('copy').textContent='Не вышло, обнови страницу'}
  save();setTimeout(()=>$('copy').textContent='Копировать для рассказчика',2500);
}
$('copy').onclick=()=>doCopy(false);$('copy2').onclick=()=>doCopy(true);
render();renderWorld();renderLog();
(S.pos||[]).forEach((p,i)=>{if(!p)return;pos[i]=p;rep[i]=(S.rep||[])[i]||'';
  mk[i]=L.circleMarker(p,{radius:9,color:'#fff',weight:2,fillColor:COL[i],fillOpacity:1}).addTo(map);
  rg[i]=L.circle(p,{radius:R,color:COL[i],weight:1,dashArray:'4 4',fill:false}).addTo(map)});
S.marks.forEach(drawMark);
{const f=pos.find(Boolean);if(f)map.setView(f,16)}
out();
</script>
