<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Планшет рассказчика</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#1c2428;--panel:#243036;--ink:#e8e3d4;--dim:#9aa6a3;--line:#3a4a50;--red:#c2402f;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif}
#bar{display:flex;gap:8px;padding:8px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--panel)}
input,textarea,button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px}
#q{flex:1;min-width:0}
button.main{background:var(--red);border-color:var(--red);font-weight:600}
#map{flex:1 1 45%;min-height:220px}
#panel{flex:1 1 40%;overflow:auto;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:2px solid var(--red)}
#out{white-space:pre-wrap;user-select:text;font:14px/1.45 ui-monospace,Menlo,monospace;margin:0 0 10px}
#note{width:100%;min-height:56px;margin-bottom:8px;resize:vertical}
#copy{width:100%;position:sticky;bottom:0}
.hint{color:var(--dim)}
select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px}
#tabs{display:flex;gap:6px;margin-bottom:8px}
#tabs button.on{background:var(--red);border-color:var(--red)}
.hero{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:10px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.g input,.g select{width:100%;min-width:0;padding:8px}
.hero textarea,.act{width:100%;min-height:60px;margin-bottom:6px}
label{display:block;color:var(--dim);font-size:12px}
.w{font-size:14px;margin:0 0 4px}
.bad{color:#ff8a70}
#clock{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
#clock button{padding:8px}
#rl{font:14px ui-monospace,Menlo,monospace;white-space:pre-wrap;margin:0 0 8px}
#mode{display:flex;gap:6px;padding:6px 8px;background:var(--panel)}
#mode button{flex:1;padding:8px}
#mode button.on{background:var(--red);border-color:var(--red)}
#mode{flex-wrap:wrap}#mode select{padding:8px}
.mk{font-size:20px;line-height:28px;text-align:center;text-shadow:0 0 3px #000}
.bar{height:6px;background:var(--bg);border-radius:3px;margin-top:3px}.bar i{display:block;height:100%;border-radius:3px}
.dl{display:flex;gap:10px;margin-bottom:6px}.dl>div{flex:1;display:grid;gap:4px;align-content:start}.hero button{padding:8px}
details{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;padding:6px 8px}summary{cursor:pointer;font-weight:700;padding:4px 0}.chip.on{background:var(--red);border-color:var(--red)}#hs>.g button.on{border-color:#fff;font-weight:700}
</style>
</head>
<body>
<div id="bar">
  <input id="q" placeholder="Найти место: город, улица, адрес" enterkeyhint="search">
  <button id="go">Найти</button>
</div>
<div id="mode"><button id="m2" class="on">Оба вместе</button><button id="m0">Игрок 1</button><button id="m1">Игрок 2</button><button id="mkb">Метка</button><select id="mt"></select></div>
<div id="map"></div>
<div id="panel">
  <div id="tabs"><button id="t0" class="on">Сводка</button><button id="t1">Герои</button><button id="t2">Мир</button></div>
  <section id="p0">
    <pre id="out" class="hint">Нажми на карту, чтобы поставить героев. Сводка появится здесь.</pre>
    <div class="g"><select id="df"><option value="80">Лёгкое</option><option value="55" selected>Обычное</option><option value="30">Трудное</option><option value="10">Почти невозможное</option></select><input id="md" type="number" value="0" step="5" aria-label="Сдвиг шанса, пункты"></div>
    <button id="dice" style="width:100%;margin-bottom:8px">Бросок d100</button>
    <pre id="rl" class="hint">Броска ещё не было.</pre>
    <textarea id="a0" class="act" placeholder="Действие игрока 1"></textarea>
    <textarea id="a1" class="act" placeholder="Действие игрока 2"></textarea>
  </section>
  <section id="p1" hidden>
    <div id="clock"><b id="clk"></b><button data-m="10">+10 мин</button><button data-m="60">+1 ч</button><button data-m="360">+6 ч</button><input id="tp" placeholder="Погода, t°" style="width:110px"><select id="act"></select></div>
    <div id="hs"></div>
  </section>
  <section id="p2" hidden><div id="wd"></div></section>
  <button id="copy" class="main">Копировать для рассказчика</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const R=300, DIRS=['С','СВ','В','ЮВ','Ю','ЮЗ','З','СЗ'];
const EP=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
const SH={supermarket:'супермаркет',convenience:'магазин у дома',mall:'ТЦ',hardware:'хозтовары',doityourself:'стройматериалы',alcohol:'алкоголь',clothes:'одежда',car_repair:'автосервис',kiosk:'киоск'};
const $=id=>document.getElementById(id);
let mode=2;const pos=[null,null],rep=['',''],mk=[null,null],rg=[null,null],COL=['#c2402f','#3b82c4'];

const map=L.map('map').setView([53.11,50.22],11);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
map.on('click',e=>onMap(e.latlng.lat,e.latlng.lng));

function dist(a,b,c,d){const r=Math.PI/180,x=(c-a)*r,y=(d-b)*r*Math.cos((a+c)/2*r);return Math.hypot(x,y)*6371000}
function dir(a,b,c,d){const r=Math.PI/180,t=Math.atan2((d-b)*r*Math.cos(a*r),(c-a)*r)*180/Math.PI;return DIRS[Math.round(((t+360)%360)/45)%8]}

function cls(t){
  const a=t.amenity;
  if(a==='pharmacy')return 'Аптеки';
  if(/^(hospital|clinic|doctors)$/.test(a))return 'Медицина';
  if(/^(police|fire_station)$/.test(a))return 'Полиция и пожарные';
  if(a==='fuel')return 'Заправки';
  if(/^(school|kindergarten)$/.test(a))return 'Школы и сады';
  if(/^(restaurant|cafe|fast_food)$/.test(a))return 'Еда';
  if(t.shop)return 'Магазины';
  if(t.man_made)return 'Вода и ёмкости';
  if(t.building==='warehouse'||t.industrial)return 'Склады и промзона';
  if(parseInt(t['building:levels'])>=9)return 'Высотки 9+ эт.';
  return null;
}
function label(t){
  if(t.name)return t.name+(t.shop?' ('+(SH[t.shop]||t.shop)+')':'');
  if(t.shop)return SH[t.shop]||t.shop;
  if(t['building:levels'])return 'дом, '+t['building:levels']+' эт.';
  return 'без названия';
}

async function geo(lat,lng){
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&zoom=18&accept-language=ru&lat=${lat}&lon=${lng}`);
    return (await r.json()).display_name||'';
  }catch(e){return ''}
}
async function over(lat,lng){
  const a=`(around:${R},${lat},${lng})`;
  const q=`[out:json][timeout:25];(nwr${a}["amenity"~"^(pharmacy|hospital|clinic|doctors|police|fire_station|fuel|school|kindergarten|restaurant|cafe|fast_food)$"];nwr${a}["shop"];nwr${a}["man_made"~"^(water_tower|storage_tank)$"];nwr${a}["building"="warehouse"];nwr${a}["industrial"];nwr${a}["building:levels"~"^(9|[12][0-9])$"];way${a}["highway"~"^(motorway|trunk|primary|secondary|tertiary|residential|unclassified|living_street)$"];);out center tags;`;
  for(const u of EP){
    try{
      const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(q)});
      if(r.ok)return (await r.json()).elements;
    }catch(e){}
  }
  throw new Error('overpass');
}

function build(lat,lng,addr,els){
  const g={},roads={},br=new Set();
  for(const e of els){
    const t=e.tags||{};
    if(t.highway){const n=t.name||t.ref;if(n){roads[n]=1;if(t.bridge)br.add(n)}continue}
    const k=cls(t);if(!k)continue;
    const la=e.lat??(e.center&&e.center.lat),lo=e.lon??(e.center&&e.center.lon);
    if(la==null)continue;
    (g[k]=g[k]||[]).push({n:label(t),la,lo});
  }
  return {addr,g,roads:Object.keys(roads),br:[...br]};
}
function snapd(m,i){const r=rep[i];return m.t!=='затор'&&r&&typeof r==='object'&&Object.values(r.g).some(v=>v.some(o=>dist(o.la,o.lo,m.la,m.lo)<=SNAP))}
function fmt(sc,i){
  if(typeof sc==='string')return sc;
  const q=pos[i],ln=[`Точка: ${q[0].toFixed(5)}, ${q[1].toFixed(5)}`];
  if(sc.addr)ln.push('Адрес: '+sc.addr);
  for(const [k,v] of Object.entries(sc.g)){
    const it=v.map(o=>{const ms=S.marks.filter(m=>m.t!=='затор'&&dist(o.la,o.lo,m.la,m.lo)<=SNAP);
      return {...o,d:dist(q[0],q[1],o.la,o.lo),w:dir(q[0],q[1],o.la,o.lo),s:ms.some(m=>m.t==='обыскано'),tg:[...new Set(ms.map(m=>(EFF[m.t]||'')+(m.n?(EFF[m.t]?': ':'')+m.n:'')).filter(Boolean))]}}).sort((a,b)=>a.s-b.s||a.d-b.d);
    const ns=it.filter(x=>x.s).length;
    ln.push('',`${k} (${it.length}${ns?', обыскано '+ns:''}):`);
    it.slice(0,5).forEach(x=>ln.push(`- ${x.n}: ${x.w}, ${Math.round(x.d)} м${x.d<=100?' (рядом)':''}${x.tg.length?' ['+x.tg.join('; ')+']':''}`));
  }
  if(sc.roads.length)ln.push('','Дороги: '+sc.roads.slice(0,8).join(', '));
  if(sc.br.length)ln.push('Мосты: '+sc.br.join(', '));
  if(!Object.keys(sc.g).length&&!sc.roads.length)ln.push('','Поблизости ничего не отмечено: пустырь, поле или лес.');
  return ln.join('\n');
}

function show(t,dim){const o=$('out');o.textContent=t;o.className=dim?'hint':''}

function area(){
  if(!pos[0]&&!pos[1])return 'не выбрана';
  const d=pos[0]&&pos[1]?dist(pos[0][0],pos[0][1],pos[1][0],pos[1][1]):null,tog=d!==null&&d<=100;
  const nm=i=>{const q=pos[i];if(!q)return [];const k=S.marks.filter(m=>!snapd(m,i)).map(m=>({m,d:dist(q[0],q[1],m.la,m.lo),w:dir(q[0],q[1],m.la,m.lo)})).filter(x=>x.d<=R).sort((a,b)=>a.d-b.d).map(x=>`${MT[x.m.t]} ${x.m.t}: ${x.w}, ${Math.round(x.d)} м${x.m.n?' ('+x.m.n+')':''}`);return k.length?['','Метки:',...k]:[]};
  const sec=(h,i)=>[h,rep[i]?fmt(rep[i],i):'(нет данных сканера)',...nm(i)].join('\n');
  const o=[`Обзор ${R} м, «рядом» = до 100 м.`];
  if(tog)o.push(sec('ОБА ГЕРОЯ ВМЕСТЕ',0));
  else{[0,1].forEach(i=>o.push(pos[i]?sec(`ИГРОК ${i+1} (${S.h[i].n||'без имени'})`,i):`ИГРОК ${i+1}: ещё не на карте`));if(d!==null)o.push(`Между героями: ${Math.round(d)} м, игрок 2 на ${dir(...pos[0],...pos[1])} от игрока 1.`)}
  return o.join('\n\n');
}
async function scan(lat,lng){
  const t=mode===2?[0,1]:[mode],p=[lat,lng];
  t.forEach(i=>{
    pos[i]=p;rep[i]='';
    if(mk[i]){mk[i].setLatLng(p);rg[i].setLatLng(p)}
    else{
      mk[i]=L.circleMarker(p,{radius:9,color:'#fff',weight:2,fillColor:COL[i],fillOpacity:1}).addTo(map);
      rg[i]=L.circle(p,{radius:R,color:COL[i],weight:1,dashArray:'4 4',fill:false}).addTo(map);
    }
  });
  show('Сканирую местность…',true);save();
  try{
    const [addr,els]=await Promise.all([geo(lat,lng),over(lat,lng)]);
    const r=build(lat,lng,addr,els);t.forEach(i=>rep[i]=r);show(area());save();
  }catch(e){
    show('Сервер карт не ответил. Нажми на карту ещё раз через несколько секунд.',true);
  }
}
[2,0,1].forEach(m=>$('m'+m).onclick=()=>{mode=m;[2,0,1].forEach(k=>$('m'+k).classList.toggle('on',k===m))});

async function find(){
  const q=$('q').value.trim();if(!q)return;
  try{
    const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=ru&q='+encodeURIComponent(q));
    const j=await r.json();
    if(!j.length){show('Место не найдено. Попробуй написать иначе.',true);return}
    const la=+j[0].lat,lo=+j[0].lon;
    map.setView([la,lo],16);scan(la,lo);
  }catch(e){show('Поиск не ответил. Попробуй ещё раз.',true)}
}
$('go').onclick=find;
$('q').onkeydown=e=>{if(e.key==='Enter')find()};

const LK='zmb2',RATE={h:.45,t:.6,f:.6},SUN=[0,1,4];let mkMode=false;
const ACT=[['покой',1.2,.4],['ходьба налегке',3.5,.6],['ходьба с грузом',4.5,.9],['бег',8,2],['сон',.95,-1.5],['тяжёлая работа',6,1.2]];
const FOODS=[['Хлеб',250,8,3,49,[0,15,0,0,3,10,3,15]],['Тушёнка',230,15,18,0,[0,10,0,2,2,15,2,20]],['Гречка сухая',340,13,3,72,[0,25,0,0,5,25,2,0]],['Макароны сухие',350,12,1.5,72,[0,10,0,0,2,10,1,0]],['Рис сухой',350,7,1,78,[0,8,0,0,1,5,1,0]],['Фасоль консерв.',100,7,.5,17,[0,10,5,0,3,15,5,10]],['Картофель',77,2,.1,17,[0,10,20,0,1,5,1,5]],['Яблоко',52,.3,.2,14,[1,3,10,0,2,1,1,0]],['Апельсин',47,1,.1,12,[5,5,90,0,2,1,4,0]],['Овощи консерв.',25,1,.1,5,[20,5,15,0,3,5,3,25]],['Рыбные консервы',200,20,13,0,[5,15,0,60,5,10,20,25]],['Сыр',350,25,28,1,[20,5,0,5,3,2,70,40]],['Печенье',450,7,15,70,[0,5,0,0,3,5,2,10]],['Шоколад',540,6,31,58,[0,5,0,0,5,20,5,3]],['Орехи',600,18,55,10,[0,10,0,0,50,15,10,0]],['Сгущёнка',320,7,8,55,[5,10,0,3,1,1,25,5]]];
const MT={'обыскано':'✔','затор':'🚧','зомби':'☠','орда':'☣','убежище':'🏠','опасность':'⚠','вода':'💧','топливо':'⛽','транспорт':'🚗','люди':'👤','добыча':'📦','закрыто':'🔒','заметка':'✎'};
const SNAP=45,EFF={'обыскано':'обыскан','добыча':'есть добыча','закрыто':'заперто','зомби':'зомби рядом','орда':'орда рядом','убежище':'убежище','опасность':'опасно','вода':'есть вода','топливо':'есть топливо','транспорт':'есть транспорт','люди':'люди','заметка':''};
const LIC=['M','A','B','C','D','E','тракторист'],VM=[['A','вит. A'],['B','вит. B'],['C','вит. C'],['D','вит. D'],['E','вит. E'],['Fe','железо'],['Ca','кальций'],['El','электролиты']],VR=[.6,2,3.3,.8,.5,.5,.25,12];
const VT={'Велосипед':[0,0,15,25,1,'—',0],'Самокат':[0,0,12,5,1,'—',0],'Ролики':[0,0,12,0,1,'—',0],'Скутер':[3,6,35,20,2,'M',1],'Мотоцикл':[5,15,40,40,2,'A',1],'Квадроцикл':[7,15,30,50,2,'A/тракторист',1],'Легковая':[8,50,30,400,5,'B',0],'Внедорожник':[12,70,30,500,5,'B',0],'Пикап':[11,70,30,900,5,'B',0],'Микроавтобус':[11,70,28,1000,8,'B/D',1],'Лёгкий фургон':[12,80,28,1000,3,'B',1],'Грузовик':[25,100,25,5000,3,'C',1],'Тягач с прицепом':[35,300,22,20000,2,'C/E',1],'Автобус':[30,200,22,2000,40,'D',1],'Трактор':[15,200,12,1000,2,'тракторист',1]};
const ZN=['голова','грудь','живот','л.рука','п.рука','л.нога','п.нога'],ZS=['','ушиб/ссадина','тяжёлая рана','перелом'],ZC=['#44545a','#d8b34a','#c2402f','#9a6ad0'];
const EQ=['голова','торс','ноги','обувь','спина','руки'],ND=[['h','Голод','#d8a34a'],['t','Жажда','#4aa3d8'],['f','Усталость','#9a8ad0'],['s','Стресс','#d85a4a'],['pn','Боль','#e0604a'],['bl','Кровопотеря','#b03030'],['if','Инфекция','#7ab030']];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hero=()=>({n:'',kg:70,cap:'',hp:'',inv:'',lic:'',h:0,t:0,f:0,s:0,pn:0,bl:0,if:0,tb:36.6,sk:0,sp:0,sf:0,sc:0,dk:0,dp:0,df:0,dc:0,bk:0,hg:0,wc:0,mn:[80,80,80,80,80,80,80,80],z:[0,0,0,0,0,0,0],eq:['','','','','','']});
const dflt=()=>({sel:0,op:{s:1},act:0,day:1,min:480,tp:'',roll:'',ph:100,sun:0,pos:[null,null],rep:['',''],marks:[],comp:[],veh:[],h:[hero(),hero()]});
let S;try{S=JSON.parse(localStorage.getItem(LK))}catch(e){}
S=Object.assign(dflt(),S||{});S.h=S.h.map(x=>Object.assign(hero(),x));
const save=()=>{S.pos=pos;S.rep=rep;try{localStorage.setItem(LK,JSON.stringify(S))}catch(e){}};
const out=()=>{if(pos[0]||pos[1])show(area())};
const pad=n=>String(n).padStart(2,'0');
const lt=()=>{const h=Math.floor(S.min/60);return h<6||h>=22?'ночь':h<8?'рассвет':h<18?'день':'вечер'};
const clk=()=>`День ${S.day}, ${pad(Math.floor(S.min/60))}:${pad(S.min%60)}, ${lt()}`;
const QR=/(\d+(?:[.,]\d+)?)\s*(?:кг)?(?:\s*[x×хХ]\s*(\d+))?\s*$/;
function st(x){
  let w=0;for(const l of x.inv.split('\n')){const m=l.match(QR);if(m)w+=parseFloat(m[1].replace(',','.'))*(+m[2]||1)}
  const c=+x.cap||(+x.kg||0)*.2||1,r=w/c;
  return {w,c,s:r<=1?'комфортно':r<=1.5?'нагружен: медленнее, усталость растёт':r<=2?'тяжело: бежать нельзя':'только медленный шаг рывками'};
}
const names=x=>x.inv.split('\n').map(l=>l.replace(/[;,:]?\s*\d+(?:[.,]\d+)?\s*(?:кг)?(?:\s*[x×хХ]\s*\d+)?\s*$/,'').trim()).filter(Boolean).join(', ');
function wline(i){const r=st(S.h[i]),e=$('w'+i);e.textContent=`Несёт ${r.w.toFixed(1)} кг, порог ${r.c.toFixed(1)} кг: ${r.s}`;e.className='w'+(r.w>r.c?' bad':'')}
const zcap=x=>ZN.map((a,k)=>x.z[k]?`${a}: ${ZS[x.z[k]]}`:'').filter(Boolean).join('; ')||'ран нет';
function doll(i){const x=S.h[i];
  const sh=[['circle','cx="60" cy="22" r="16"',0],['rect','x="40" y="42" width="40" height="46" rx="6"',1],['rect','x="42" y="90" width="36" height="34" rx="6"',2],['rect','x="16" y="44" width="20" height="72" rx="9"',4],['rect','x="84" y="44" width="20" height="72" rx="9"',3],['rect','x="42" y="126" width="17" height="78" rx="8"',6],['rect','x="61" y="126" width="17" height="78" rx="8"',5]];
  return `<div><svg viewBox="0 0 120 216" width="120"><g fill="#33434a" stroke="#6f7c79"><rect x="54" y="36" width="12" height="8"/><circle cx="26" cy="124" r="8"/><circle cx="94" cy="124" r="8"/><rect x="40" y="204" width="21" height="9" rx="4"/><rect x="59" y="204" width="21" height="9" rx="4"/></g>${sh.map(([t,a,k])=>`<${t} ${a} data-i="${i}" data-z="${k}" fill="${ZC[x.z[k]]}" stroke="#9aa6a3"/>`).join('')}</svg><div class="w" id="zc${i}">${zcap(x)}</div></div>`}
const det=(k,t,h)=>`<details ${S.op[k]?'open':''} ontoggle="S.op['${k}']=this.open;save()"><summary>${t}</summary>${h}</details>`;
const sbar=(i,k,l,c)=>`<div><label>${l} 0-10</label><input data-i="${i}" data-k="${k}" type="number" min="0" max="10" step="0.5" value="${Math.round((+S.h[i][k]||0)*2)/2}"><div class="bar"><i id="b${i}${k}" style="width:${Math.min(10,+S.h[i][k]||0)*10}%;background:${c}"></i></div></div>`;
const bar=(l,p,c)=>`<label>${l}</label><div class="bar"><i style="width:${Math.max(0,Math.min(100,p))}%;background:${c}"></i></div>`;
function eat(x,kc,p,f,c,vec,sc){x.sk+=kc;x.sp+=p;x.sf+=f;x.sc+=c;x.h=Math.max(0,x.h-kc/150);if(vec)x.mn=x.mn.map((v,k)=>Math.min(100,v+vec[k]*sc))}
function bodyHTML(i){const x=S.h[i],kg=+x.kg||70,tp=kg,tf=kg*.8,tc=kg*3.5,r=Math.round;
  return `<div class="w">Сегодня усвоено ${r(x.dk)} ккал, потрачено ${r(x.bk)}.</div>`+
  bar(`Белки ${r(x.dp)} из ~${r(tp)} г`,x.dp/tp*100,'#d8a34a')+bar(`Жиры ${r(x.df)} из ~${r(tf)} г`,x.df/tf*100,'#d8d34a')+bar(`Углеводы ${r(x.dc)} из ~${r(tc)} г`,x.dc/tc*100,'#4ad8a3')+bar(`Желудок ${r(x.sk)} ккал (предел ~1500)`,x.sk/15,'#9a8ad0')+
  VM.map((v,k)=>bar(`${v[1]} ${r(x.mn[k])}%`,x.mn[k],x.mn[k]<30?'#d8584a':'#6ad84a')).join('')+bar(`Грязь ${x.hg.toFixed(1)} из 10`,x.hg*10,'#8a6a4a')+bar(`Туалет ${x.wc.toFixed(1)} из 10`,x.wc*10,'#4aa3d8')+
  `<div class="g" style="margin-top:6px"><select data-b="fd">${FOODS.map((f,k)=>`<option value="${k}">${f[0]}</option>`).join('')}</select><input data-b="g" type="number" placeholder="Граммы" value="100"></div>
<div class="g"><button data-a="eat" data-i="${i}">Съесть</button><button data-a="wash" data-i="${i}">Помыться</button><input data-b="ml" type="number" placeholder="Вода, мл" value="500"><button data-a="drink" data-i="${i}">Выпить</button></div>
<div class="g" style="grid-template-columns:1fr 1fr 1fr"><button data-a="pill" data-i="${i}">Мультивитамин</button><button data-a="salt" data-i="${i}">Электролиты</button><button data-a="wc" data-i="${i}">В туалет</button></div>
<label>Своё блюдо на порцию: ккал, Б, Ж, У</label><div class="g" style="grid-template-columns:repeat(4,1fr)"><input data-b="k" type="number" placeholder="ккал"><input data-b="p" type="number" placeholder="Б"><input data-b="fa" type="number" placeholder="Ж"><input data-b="c" type="number" placeholder="У"></div><button data-a="own" data-i="${i}" style="width:100%">Съесть своё</button>`}
function render(){
  $('clk').textContent=clk();$('tp').value=S.tp;
  const i=S.sel,x=S.h[i];
  $('hs').innerHTML=`<div class="g">${[0,1].map(j=>`<button data-sel="${j}" class="${j==i?'on':''}" style="color:${COL[j]}">● ${esc(S.h[j].n||'Игрок '+(j+1))}</button>`).join('')}</div>
<div class="hero"><div class="g"><input data-i="${i}" data-k="n" placeholder="Имя" value="${esc(x.n)}"><input data-i="${i}" data-k="kg" type="number" step="0.1" placeholder="Вес, кг (считается сам)" value="${Math.round((+x.kg||0)*10)/10}"></div>
<div class="g"><input data-i="${i}" data-k="cap" type="number" step="0.5" placeholder="Порог ноши, кг (пусто = 20%)" value="${x.cap}"><input data-i="${i}" data-k="hp" placeholder="Здоровье, заметки" value="${esc(x.hp)}"></div><div class="w" id="w${i}"></div></div>`+
  det('s','Состояние и раны',`<div class="dl">${doll(i)}<div>${EQ.map((l,k)=>`<input data-i="${i}" data-e="${k}" placeholder="Надето: ${l}" value="${esc(x.eq[k])}">`).join('')}</div></div><label>Тап по зоне тела: ушиб, тяжёлая рана, перелом, норма</label><div class="g">${ND.map(([k,l,c])=>sbar(i,k,l,c)).join('')}<div><label>Температура тела, °C</label><input data-i="${i}" data-k="tb" type="number" step="0.1" value="${x.tb}"></div></div>`)+
  det('n','Питание и тело',bodyHTML(i))+
  det('v','Вещи',`<label>Предмет и вес в кг, по строке (×3 для количества)</label><textarea data-i="${i}" data-k="inv" placeholder="Топор 1.5">${esc(x.inv)}</textarea>`)+
  det('d','Документы: водительские права',`<div class="g" style="grid-template-columns:repeat(4,1fr)">${LIC.map(t=>`<button class="chip ${(x.lic||'').split(' ').includes(t)?'on':''}" data-lic="${t}" data-i="${i}">${t}</button>`).join('')}</div>`);
  wline(i);
}
$('hs').addEventListener('input',e=>{
  const d=e.target.dataset;if(d.i===undefined)return;const x=S.h[d.i],v=e.target.value;
  if(d.e!==undefined)x.eq[d.e]=v;
  else if(d.k){x[d.k]=['kg','cap','h','t','f','s','pn','bl','if','tb'].includes(d.k)?(v===''?'':+v):v;wline(d.i);ND.forEach(([k])=>{$('b'+d.i+k).style.width=Math.min(10,+x[k]||0)*10+'%'})}
  save();
});
$('hs').addEventListener('click',e=>{
  const t=e.target.closest('[data-sel],[data-z],[data-lic],[data-a]');if(!t)return;const d=t.dataset;
  if(d.sel!==undefined){S.sel=+d.sel;render();save();return}
  const i=+d.i,x=S.h[i],q=k=>+($('hs').querySelector(`[data-b="${k}"]`).value)||0;
  if(d.z!==undefined){const k=+d.z;x.z[k]=(x.z[k]+1)%4;t.setAttribute('fill',ZC[x.z[k]]);$('zc'+i).textContent=zcap(x);save();return}
  if(d.lic!==undefined){const a=(x.lic||'').split(' ').filter(Boolean),k=a.indexOf(d.lic);k<0?a.push(d.lic):a.splice(k,1);x.lic=a.join(' ');render();save();return}
  const a=d.a;
  if(a==='eat'){const f=FOODS[q('fd')],g=q('g')/100;eat(x,f[1]*g,f[2]*g,f[3]*g,f[4]*g,f[5],g)}
  else if(a==='own')eat(x,q('k'),q('p'),q('fa'),q('c'),null,0);
  else if(a==='drink'){const ml=q('ml');x.t=Math.max(0,x.t-ml/150);x.wc=Math.min(10,x.wc+ml/400)}
  else if(a==='pill')x.mn=x.mn.map((v,k)=>k<7?Math.min(100,v+30):v);
  else if(a==='salt')x.mn[7]=Math.min(100,x.mn[7]+40);
  else if(a==='wash')x.hg=Math.max(0,x.hg-6);else if(a==='wc')x.wc=0;else return;
  render();save();
});
function adv(m){
  const a=ACT[S.act],c=v=>Math.max(0,Math.min(10,v));let nd=false;
  S.min+=m;while(S.min>=1440){S.min-=1440;S.day++;nd=true}
  S.h.forEach(x=>{
    const bn=a[1]*(+x.kg||70)*m/60,dg=Math.min(x.sk,150*m/60),fr=x.sk?dg/x.sk:0;
    x.bk+=bn;x.dk+=dg;x.dp+=x.sp*fr;x.df+=x.sf*fr;x.dc+=x.sc*fr;
    x.sp-=x.sp*fr;x.sf-=x.sf*fr;x.sc-=x.sc*fr;x.sk-=dg;
    x.kg=Math.max(30,(+x.kg||70)+(dg-bn)/7700);
    x.h=c(x.h+RATE.h*m/60*(x.sk>100?.3:1)*(S.act==4?.5:1));
    x.t=c(x.t+RATE.t*m/60*(a[1]>3?1.5:1));
    x.f=c(x.f+a[2]*m/60);
    x.mn=x.mn.map((v,k)=>Math.max(0,v-VR[k]*m/1440));if(x.z.some(v=>v>0)&&x.hg>=6)x.if=c(x.if+.1*m/60);x.hg=c(x.hg+.15*m/60);x.wc=c(x.wc+.3*m/60);
    if(nd){x.dk=x.dp=x.df=x.dc=x.bk=0}
  });
  S.ph=Math.max(0,Math.min(100,S.ph-.5*m/60+(['рассвет','день'].includes(lt())?SUN[S.sun]*m/60:0)));
  render();renderWorld();save();
}
document.querySelectorAll('#clock [data-m]').forEach(b=>b.onclick=()=>adv(+b.dataset.m));
$('tp').oninput=e=>{S.tp=e.target.value;save()};
$('act').innerHTML=ACT.map((a,i)=>`<option value="${i}">${a[0]}</option>`).join('');$('act').value=S.act;$('act').onchange=e=>{S.act=+e.target.value;save()};
[0,1,2].forEach(i=>$('t'+i).onclick=()=>[0,1,2].forEach(j=>{$('p'+j).hidden=j!==i;$('t'+j).classList.toggle('on',j===i)}));

function renderWorld(){
  $('wd').innerHTML=`<div class="hero"><b>КПК</b><div class="g"><div><label>Заряд, %</label><input data-g="p" type="number" min="0" max="100" value="${Math.round(S.ph)}"></div><div><label>Солнце на панели</label><select data-g="sun">${['нет','пасмурно','ясно'].map((x,i)=>`<option value="${i}"${i==S.sun?' selected':''}>${x}</option>`).join('')}</select></div></div><button data-a="ai" style="width:100%">Запрос помощнику (−2%)</button></div>
<div class="hero"><b>Спутники</b>${S.comp.map((c,i)=>`<div class="g"><input data-g="c" data-i="${i}" data-k="n" placeholder="Имя" value="${esc(c.n)}"><input data-g="c" data-i="${i}" data-k="k" placeholder="Кто (кошка, человек)" value="${esc(c.k)}"><input data-g="c" data-i="${i}" data-k="s" placeholder="Состояние" value="${esc(c.s)}"><button data-a="dc" data-i="${i}">Убрать</button></div>`).join('')}<button data-a="ac" style="width:100%">+ Спутник</button></div>
<div class="hero"><b>Транспорт</b>${S.veh.map((v,i)=>`<div class="g"><select data-g="v" data-i="${i}" data-k="t">${Object.keys(VT).map(k=>`<option${k==v.t?' selected':''}>${k}</option>`).join('')}</select><input data-g="v" data-i="${i}" data-k="n" placeholder="Название, состояние" value="${esc(v.n)}"><input data-g="v" data-i="${i}" data-k="f" type="number" placeholder="Топливо, л" value="${v.f}"><button data-a="dv" data-i="${i}">Убрать</button><button data-a="dr" data-i="${i}" style="grid-column:1/3">Проехать N км</button><div class="w" style="grid-column:1/3">${vinfo(v)}</div></div>`).join('')}<button data-a="av" style="width:100%">+ Транспорт</button></div>
<div class="hero"><b>Метки от рассказчика</b><label>Строка: тип | игрок 1 или 2 | сторона | метры | подпись</label><textarea id="imp" placeholder="зомби | 1 | СВ | 150 | орда у ТЦ"></textarea><button data-a="im" style="width:100%">Поставить метки</button></div>`;
}
$('wd').addEventListener('input',e=>{
  const d=e.target.dataset,v=e.target.value;
  if(d.g==='p')S.ph=+v||0;else if(d.g==='sun')S.sun=+v;
  else if(d.g==='c')S.comp[d.i][d.k]=v;else if(d.g==='v')S.veh[d.i][d.k]=d.k==='f'?+v||0:v;
  save();
});
$('wd').addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=+b.dataset.i;
  if(a==='ai')S.ph=Math.max(0,S.ph-2);
  else if(a==='ac')S.comp.push({n:'',k:'',s:''});else if(a==='dc')S.comp.splice(i,1);
  else if(a==='av')S.veh.push({t:'Велосипед',n:'',f:0});else if(a==='dv')S.veh.splice(i,1);
  else if(a==='dr'){drive(i);return}
  else if(a==='im')impMarks($('imp').value);
  save();renderWorld();
});
function vinfo(v){const r=VT[v.t],need=r[5]==='—'?[]:r[5].split('/'),lic=i=>need.some(t=>(S.h[i].lic||'').split(' ').includes(t));
  return `кат. ${r[5]}, ${r[6]?'сложная':'простая'} техника, груз ${r[3]} кг, мест ${r[4]}, ${r[2]} км/ч`+(need.length?`; права: И1 ${lic(0)?'есть':'нет'}, И2 ${lic(1)?'есть':'нет'}`:'')}
function drive(i){
  const v=S.veh[i],r=VT[v.t],km=parseFloat((prompt('Сколько км?','')||'').replace(',','.'));
  if(!(km>0))return;
  if(r[0]){
    const need=km*r[0]/100*(confirm('Завалы или город (расход ×2)? ОК = да')?2:1);
    if(need>v.f){alert('Топлива не хватит. Хватит примерно на '+Math.floor(v.f/(need/km))+' км.');return}
    v.f=+(v.f-need).toFixed(1);
  }
  const a0=S.act;S.act=r[0]?0:1;adv(Math.round(km/r[2]*60));S.act=a0;$('act').value=a0;
}
function impMarks(txt){
  let n=0;
  for(const l of txt.split('\n')){
    const a=l.split('|').map(x=>x.trim());if(a.length<4)continue;
    const t=Object.keys(MT).find(k=>a[0].toLowerCase().startsWith(k.slice(0,4))),i=(+a[1]||1)-1,w=DIRS.indexOf(a[2].toUpperCase()),m=parseFloat(a[3]),p=pos[i];
    if(!t||w<0||!(m>0)||!p)continue;
    const b=w*Math.PI/4;addMark(t,p[0]+m*Math.cos(b)/111320,p[1]+m*Math.sin(b)/(111320*Math.cos(p[0]*Math.PI/180)),a[4]||'');n++;
  }
  alert('Поставлено меток: '+n);
}
function drawMark(o){
  const m=L.marker([o.la,o.lo],{icon:L.divIcon({className:'mk',html:MT[o.t],iconSize:[28,28]})}).addTo(map);
  m.on('click',()=>{if(confirm('Удалить метку: '+o.t+(o.n?' ('+o.n+')':'')+'?')){map.removeLayer(m);S.marks=S.marks.filter(x=>x!==o);save();out()}});
}
function addMark(t,la,lo,n){const o={t,la,lo,n};S.marks.push(o);drawMark(o);save();out()}
function onMap(la,lo){
  if(mkMode){const n=prompt('Подпись метки (можно пусто)','');if(n===null)return;addMark($('mt').value,la,lo,n.trim())}
  else scan(la,lo);
}
$('mkb').onclick=()=>{mkMode=!mkMode;$('mkb').classList.toggle('on',mkMode);$('mkb').textContent=mkMode?'Метка: ВКЛ':'Метка'};
$('mt').innerHTML=Object.keys(MT).map(k=>`<option value="${k}">${MT[k]} ${k}</option>`).join('');

$('dice').onclick=()=>{
  const d=1+Math.floor(Math.random()*100),b=+$('df').value,m=+$('md').value||0,th=Math.max(0,Math.min(95,b+m));
  const res=d<=th?(d<=5?'УСПЕХ с бонусом':'успех'):(d>=96?'ПРОВАЛ с осложнением':'промах');
  S.roll=`d100 = ${d}, порог ${th}% (${$('df').selectedOptions[0].text.toLowerCase()}${m?', сдвиг '+(m>0?'+':'')+m:''}): ${res}`;
  $('rl').textContent=S.roll;$('rl').className='';save();
};

$('copy').onclick=async()=>{
  const n=(x,k)=>Math.round((+x[k]||0)*10)/10;
  const nut=x=>`питание за день: ${Math.round(x.dk)} ккал (Б ${Math.round(x.dp)}, Ж ${Math.round(x.df)}, У ${Math.round(x.dc)}), потрачено ${Math.round(x.bk)}; желудок ${Math.round(x.sk)} ккал; запасы %: ${VM.map((v,k)=>v[0]+' '+Math.round(x.mn[k])).join(', ')}; грязь ${n(x,'hg')}/10; туалет ${n(x,'wc')}/10`;
  const hv=(x,i)=>{const r=st(x),z=ZN.map((a,k)=>x.z[k]?`${a}: ${ZS[x.z[k]]}`:'').filter(Boolean).join(', '),eq=EQ.map((l,k)=>x.eq[k]?`${l} ${x.eq[k]}`:'').filter(Boolean).join(', ');
    return `ИГРОК ${i+1}: ${x.n||'без имени'}; вес тела ${(+x.kg).toFixed(1)} кг; активность: ${ACT[S.act][0]}; раны: ${[x.hp,z].filter(Boolean).join('; ')||'нет'}; голод ${n(x,'h')}/10, жажда ${n(x,'t')}/10, усталость ${n(x,'f')}/10, стресс ${n(x,'s')}/10, боль ${n(x,'pn')}/10, кровопотеря ${n(x,'bl')}/10, инфекция ${n(x,'if')}/10, температура тела ${x.tb}; ноша ${r.w.toFixed(1)} из ${r.c.toFixed(1)} кг (${r.s}); надето: ${eq||'-'}; вещи: ${names(x)||'пусто'}; ${nut(x)}`};
  const o=[`ВРЕМЯ: ${clk()}${S.tp?', '+S.tp:''}`,...S.h.map(hv),`КПК: заряд ${Math.round(S.ph)}%`];
  if(S.comp.length)o.push('СПУТНИКИ: '+S.comp.map(c=>`${c.n||'?'} (${c.k||'-'}): ${c.s||'-'}`).join('; '));
  if(S.veh.length)o.push('ТРАНСПОРТ: '+S.veh.map(v=>`${v.t} (кат. ${VT[v.t][5]})${v.n?' '+v.n:''}${VT[v.t][0]?', топливо '+v.f+' из '+VT[v.t][1]+' л':''}`).join('; '));
  o.push('МЕСТНОСТЬ:\n'+area(),'БРОСОК: '+(S.roll||'нет'),`ДЕЙСТВИЯ:\nИгрок 1: ${$('a0').value.trim()||'-'}\nИгрок 2: ${$('a1').value.trim()||'-'}`);
  try{await navigator.clipboard.writeText(o.join('\n\n'));$('copy').textContent='Скопировано'}
  catch(e){$('copy').textContent='Не вышло, обнови страницу'}
  S.roll='';$('rl').textContent='Броска ещё не было.';$('rl').className='hint';save();
  setTimeout(()=>$('copy').textContent='Копировать для рассказчика',2500);
};
render();renderWorld();
(S.pos||[]).forEach((p,i)=>{if(!p)return;pos[i]=p;rep[i]=(S.rep||[])[i]||'';
  mk[i]=L.circleMarker(p,{radius:9,color:'#fff',weight:2,fillColor:COL[i],fillOpacity:1}).addTo(map);
  rg[i]=L.circle(p,{radius:R,color:COL[i],weight:1,dashArray:'4 4',fill:false}).addTo(map)});
S.marks.forEach(drawMark);
{const f=pos.find(Boolean);if(f)map.setView(f,16)}
out();
</script>
</body>
</html>
